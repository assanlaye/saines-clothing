<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
  <button (click)="goBack()" class="flex items-center text-sm font-medium text-gray-500 hover:text-gray-700 mb-8 transition-colors">
    <svg class="w-5 h-5 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
    BACK TO COLLECTION
  </button>

  <div *ngIf="loading" class="flex justify-center items-center h-96">
    <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-gray-900"></div>
  </div>

  <div *ngIf="error" class="bg-red-50 text-red-700 p-4 rounded-md">
    {{ error }}
  </div>

  <div *ngIf="!loading && product" class="flex flex-col lg:flex-row gap-12">
    <!-- Image Gallery -->
    <div class="lg:w-3/5">
      <div class="aspect-w-3 aspect-h-4 bg-gray-100 overflow-hidden">
        <img [src]="activeImage" [alt]="product.name" class="w-full h-full object-center object-cover">
      </div>
      <div class="mt-4 grid grid-cols-4 gap-4">
        <div *ngFor="let img of product.images" 
             (click)="activeImage = img.url"
             [class.ring-2]="activeImage === img.url"
             class="aspect-w-1 aspect-h-1 bg-gray-100 cursor-pointer ring-gray-900">
           <img [src]="img.url" class="w-full h-32 object-cover">
        </div>
      </div>
    </div>

    <!-- Product Details -->
    <div class="lg:w-2/5 flex flex-col gap-8">
      <div>
        <h1 class="text-3xl font-extrabold tracking-tight text-gray-900">{{ product.name }}</h1>
        <p class="mt-3 text-2xl text-gray-900 font-medium">D{{ product.price | number:'1.2-2' }}</p>
      </div>

      <div class="border-t border-b py-6">
        <h3 class="text-sm font-bold text-gray-900 uppercase tracking-widest mb-4">Description</h3>
        <p class="text-base text-gray-600 leading-relaxed">{{ product.description }}</p>
      </div>

      <!-- Size Selector -->
      <div>
        <div class="flex items-center justify-between mb-4">
          <h3 class="text-sm font-bold text-gray-900 uppercase tracking-widest">Select Size</h3>
          <a href="#" class="text-xs font-semibold text-gray-500 underline hover:text-gray-900">Size Guide</a>
        </div>
        <div class="grid grid-cols-4 gap-3">
          <button 
            *ngFor="let size of product.sizes"
            (click)="selectSize(size)"
            [class.bg-gray-900]="selectedSize === size"
            [class.text-white]="selectedSize === size"
            [class.border-gray-900]="selectedSize === size"
            class="py-3 text-sm font-medium border border-gray-200 hover:border-gray-900 transition-all uppercase"
          >
            {{ size }}
          </button>
        </div>
      </div>

      <!-- Actions -->
      <div class="flex flex-col gap-4 pt-4">
        <button 
          (click)="addToCart()"
          [disabled]="product.stockQuantity === 0"
          class="w-full bg-gray-900 text-white py-4 text-sm font-bold uppercase tracking-widest hover:bg-gray-800 transition-all disabled:bg-gray-400 disabled:cursor-not-allowed"
        >
          {{ product.stockQuantity > 0 ? 'Add to Bag' : 'Out of Stock' }}
        </button>
        <button class="w-full border border-gray-900 text-gray-900 py-4 text-sm font-bold uppercase tracking-widest hover:bg-gray-50 transition-all">
          Add to Wishlist
        </button>
      </div>

      <!-- Details -->
      <div class="pt-4 flex flex-col gap-2">
         <p class="text-xs text-gray-500 uppercase tracking-widest">Category: <span class="text-gray-900 font-bold ml-1">{{ product.category }}</span></p>
         <p class="text-xs text-gray-500 uppercase tracking-widest">Type: <span class="text-gray-900 font-bold ml-1">{{ product.type }}</span></p>
         <p class="text-xs text-gray-500 uppercase tracking-widest">Stock: 
            <span [class.text-green-600]="product.stockQuantity > 10" [class.text-red-600]="product.stockQuantity <= 10" class="font-bold ml-1">
              {{ product.stockQuantity > 0 ? product.stockQuantity + ' available' : 'Out of Stock' }}
            </span>
         </p>
      </div>
    </div>
  </div>
</div>
