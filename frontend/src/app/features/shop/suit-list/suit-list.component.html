<div class="container mt-4">
  <!-- Filters & Search -->
  <div class="row mb-4">
    <div class="col-md-12">
      <form [formGroup]="filterForm" class="row g-3">
        <div class="col-md-4">
          <input type="text" formControlName="search" class="form-control" placeholder="Search suits...">
        </div>
        <div class="col-md-3">
          <select formControlName="category" class="form-select">
            <option value="">All Categories</option>
            <option value="Wedding">Wedding</option>
            <option value="Business">Business</option>
            <option value="Party">Party</option>
            <option value="Casual">Casual</option>
          </select>
        </div>
        <!-- Add Price filters if needed -->
      </form>
    </div>
  </div>

  <!-- Loading State -->
  <div *ngIf="loading" class="text-center py-5">
    <div class="spinner-border text-primary" role="status">
      <span class="visually-hidden">Loading...</span>
    </div>
  </div>

  <!-- Error State -->
  <div *ngIf="error" class="alert alert-danger">
    {{ error }}
  </div>

  <!-- Empty State -->
  <div *ngIf="!loading && suits.length === 0" class="text-center py-5">
    <h3>No suits found matching your criteria.</h3>
  </div>

  <!-- Product Grid -->
  <div *ngIf="!loading && suits.length > 0" class="row row-cols-1 row-cols-md-3 g-4">
    <div class="col" *ngFor="let suit of suits">
      <div class="card h-100 shadow-sm">
        <img [src]="suit.imageUrl || 'assets/placeholder-suit.jpg'" class="card-img-top" [alt]="suit.name">
        <div class="card-body">
          <h5 class="card-title">{{ suit.name }}</h5>
          <p class="card-text text-muted">{{ suit.description | slice:0:80 }}...</p>
          <div class="d-flex justify-content-between align-items-center mt-3">
            <span class="h5 mb-0 text-primary">\${{ suit.purchasePrice }}</span>
            <small class="text-muted">Rental: \${{ suit.rentalPricePerDay }}/day</small>
          </div>
        </div>
        <div class="card-footer bg-white border-top-0 d-flex justify-content-between">
            <button class="btn btn-outline-secondary btn-sm" [routerLink]="['/suits', suit._id]">Details</button>
            <button class="btn btn-primary btn-sm" [disabled]="suit.availableQuantity === 0" (click)="addToCart(suit)">
              {{ suit.availableQuantity > 0 ? 'Add to Cart' : 'Out of Stock' }}
            </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Pagination -->
  <nav *ngIf="totalPages > 1" aria-label="Page navigation" class="mt-5">
    <ul class="pagination justify-content-center">
      <li class="page-item" [class.disabled]="currentPage === 1">
        <button class="page-link" (click)="onPageChange(currentPage - 1)">Previous</button>
      </li>
      
      <li class="page-item" *ngFor="let page of pages" [class.active]="page === currentPage">
        <button class="page-link" (click)="onPageChange(page)">{{ page }}</button>
      </li>

      <li class="page-item" [class.disabled]="currentPage === totalPages">
        <button class="page-link" (click)="onPageChange(currentPage + 1)">Next</button>
      </li>
    </ul>
  </nav>
</div>
