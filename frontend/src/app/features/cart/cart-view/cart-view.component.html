<div class="container mt-5">
  <h2 class="mb-4">Your Shopping Cart</h2>

  <div *ngIf="cartItems.length === 0" class="alert alert-info">
    Your cart is empty. <a routerLink="/suits" class="alert-link">Browse Suits</a>
  </div>

  <div *ngIf="cartItems.length > 0">
    <div class="table-responsive">
      <table class="table align-middle">
        <thead>
          <tr>
            <th scope="col">Product</th>
            <th scope="col">Type</th>
            <th scope="col">Size</th>
            <th scope="col">Price</th>
            <th scope="col">Quantity</th>
            <th scope="col">Total</th>
            <th scope="col"></th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let item of cartItems">
            <td>
              <div class="d-flex align-items-center">
                <img [src]="item.imageUrl || 'assets/placeholder-suit.jpg'" alt="" style="width: 50px; height: 50px; object-fit: cover;" class="rounded me-3">
                <div>
                  <strong>{{ item.name }}</strong>
                </div>
              </div>
            </td>
            <td>
              <span class="badge" [ngClass]="item.orderType === 'Purchase' ? 'bg-primary' : 'bg-success'">
                {{ item.orderType }}
              </span>
            </td>
            <td>{{ item.size }}</td>
            <td>\${{ item.price }}</td>
            <td>{{ item.quantity }}</td>
            <td>\${{ item.price * item.quantity }}</td>
            <td>
              <button class="btn btn-sm btn-outline-danger" (click)="removeItem(item)">
                <i class="bi bi-trash"></i>
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <div class="d-flex justify-content-between align-items-center mt-4 p-3 bg-light rounded">
       <button class="btn btn-outline-danger" (click)="clearCart()">Clear Cart</button>
       <div class="text-end">
          <h4 class="mb-2">Total: \${{ totalPrice }}</h4>
          <button class="btn btn-success btn-lg" routerLink="/checkout">Proceed to Checkout</button>
       </div>
    </div>
  </div>
</div>
