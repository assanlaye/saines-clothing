<div class="container-fluid vh-100 overflow-hidden">
  <div class="row h-100">
    <!-- Left Side: Visual/Brand -->
    <div class="col-md-6 d-none d-md-flex bg-dark text-white align-items-center justify-content-center position-relative overflow-hidden">
        <div class="position-absolute w-100 h-100" style="background: linear-gradient(135deg, #2c3e50 0%, #000000 100%); opacity: 0.9; z-index: 1;"></div>
        
        <div class="position-relative text-center p-5" style="z-index: 2;">
            <h1 class="display-3 fw-bold mb-4">Join the Club</h1>
            <p class="lead mb-4">Experience the finest collection of suits tailored just for you.</p>
            <div class="d-flex justify-content-center gap-3">
                <div class="border border-light rounded-circle p-3"><i class="bi bi-gem"></i></div>
                <div class="border border-light rounded-circle p-3"><i class="bi bi-shield-check"></i></div>
                <div class="border border-light rounded-circle p-3"><i class="bi bi-star"></i></div>
            </div>
        </div>
    </div>

    <!-- Right Side: Register Form -->
    <div class="col-md-6 d-flex align-items-center justify-content-center bg-light overflow-auto">
      <div class="w-100 p-5" style="max-width: 500px;">
        <div class="text-center mb-5">
            <h2 class="fw-bold text-dark">Create Account</h2>
            <p class="text-muted">Start your journey with Saine Clothing.</p>
        </div>

        <div *ngIf="error" class="alert alert-danger shadow-sm border-0 d-flex align-items-center" role="alert">
            <i class="bi bi-exclamation-circle-fill me-2"></i>
            <div>{{ error }}</div>
        </div>

        <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
            <div class="form-floating mb-3">
              <input 
                type="text" 
                class="form-control border-0 shadow-sm" 
                id="name" 
                placeholder="John Doe"
                formControlName="name"
                [ngClass]="{'is-invalid': registerForm.get('name')?.touched && registerForm.get('name')?.invalid}"
              >
              <label for="name" class="text-muted">Full Name</label>
              <div class="invalid-feedback">
                Name is required.
              </div>
            </div>

            <div class="form-floating mb-3">
              <input 
                type="email" 
                class="form-control border-0 shadow-sm" 
                id="email" 
                placeholder="name@example.com"
                formControlName="email"
                [ngClass]="{'is-invalid': registerForm.get('email')?.touched && registerForm.get('email')?.invalid}"
              >
              <label for="email" class="text-muted">Email address</label>
              <div class="invalid-feedback">
                Please provide a valid email.
              </div>
            </div>

            <div class="form-floating mb-4">
              <input 
                type="password" 
                class="form-control border-0 shadow-sm" 
                id="password" 
                placeholder="Password"
                formControlName="password"
                [ngClass]="{'is-invalid': registerForm.get('password')?.touched && registerForm.get('password')?.invalid}"
              >
              <label for="password" class="text-muted">Password (6+ chars)</label>
              <div class="invalid-feedback">
                Password must be at least 6 characters.
              </div>
            </div>

            <div class="form-check mb-4">
                <input class="form-check-input" type="checkbox" id="terms" required>
                <label class="form-check-label text-muted small" for="terms">
                    I agree to the <a href="#" class="text-decoration-none">Terms of Service</a> and <a href="#" class="text-decoration-none">Privacy Policy</a>
                </label>
            </div>

            <div class="d-grid gap-2">
              <button type="submit" class="btn btn-dark btn-lg py-3 shadow-sm hover-elevate transition-all" [disabled]="loading || registerForm.invalid">
                <span *ngIf="loading" class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
                {{ loading ? 'Creating Account...' : 'Sign Up' }}
              </button>
            </div>
        </form>
        
        <div class="mt-5 text-center text-muted">
          <p>Already have an account? <a routerLink="/login" class="text-primary text-decoration-none fw-semibold">Sign In</a></p>
        </div>
      </div>
    </div>
  </div>
</div>
