<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-8">
      <div class="card shadow-sm">
        <div class="card-header bg-white">
          <h3 class="mb-0">Checkout</h3>
        </div>
        <div class="card-body p-4">
          
          <div *ngIf="error" class="alert alert-danger">
            {{ error }}
          </div>

          <div class="mb-4">
            <h5 class="text-muted">Order Summary</h5>
            <div class="d-flex justify-content-between">
               <span>Total Items:</span>
               <strong>{{ cartService.getItemCount() }}</strong>
            </div>
             <div class="d-flex justify-content-between">
               <span>Total Amount:</span>
               <strong class="text-primary fs-4">\${{ totalPrice }}</strong>
            </div>
            <hr>
          </div>

          <h5 class="mb-3">Delivery Information</h5>
          <form [formGroup]="checkoutForm" (ngSubmit)="onSubmit()">
            
            <div class="mb-3">
              <label for="city" class="form-label">City</label>
              <input 
                type="text" 
                class="form-control" 
                id="city" 
                formControlName="city"
                [ngClass]="{'is-invalid': checkoutForm.get('city')?.touched && checkoutForm.get('city')?.invalid}"
              >
              <div class="invalid-feedback">City is required.</div>
            </div>

            <div class="mb-3">
              <label for="homeAddress" class="form-label">Home Address</label>
              <textarea 
                class="form-control" 
                id="homeAddress" 
                rows="3" 
                formControlName="homeAddress"
                [ngClass]="{'is-invalid': checkoutForm.get('homeAddress')?.touched && checkoutForm.get('homeAddress')?.invalid}"
              ></textarea>
              <div class="invalid-feedback">Address is required.</div>
            </div>

            <div class="mb-4">
              <label for="phoneNumber" class="form-label">Phone Number</label>
              <input 
                type="tel" 
                class="form-control" 
                id="phoneNumber" 
                formControlName="phoneNumber"
                placeholder="e.g. 12345678"
                [ngClass]="{'is-invalid': checkoutForm.get('phoneNumber')?.touched && checkoutForm.get('phoneNumber')?.invalid}"
              >
              <div class="invalid-feedback">Valid phone number is required.</div>
            </div>

            <div class="d-grid gap-2">
              <button type="submit" class="btn btn-success btn-lg" [disabled]="loading || checkoutForm.invalid">
                <span *ngIf="loading" class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
                {{ loading ? 'Processing Order...' : 'Place Order (\$' + totalPrice + ')' }}
              </button>
              <a routerLink="/cart" class="btn btn-outline-secondary">Back to Cart</a>
            </div>

          </form>
        </div>
      </div>
    </div>
  </div>
</div>
