<div class="bg-white min-h-screen">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
    <div class="flex justify-between items-center mb-12 border-b border-gray-100 pb-8">
      <div>
        <h1 class="text-3xl font-extrabold tracking-tight text-gray-900 uppercase tracking-widest">Inventory Management</h1>
        <p class="mt-2 text-sm text-gray-500 uppercase tracking-tighter">Manage your collection products and stock levels.</p>
      </div>
      <button 
        (click)="showAddForm = !showAddForm"
        class="bg-gray-900 text-white px-8 py-4 text-xs font-black uppercase tracking-widest hover:bg-gray-800 transition-all"
      >
        {{ showAddForm ? 'View Catalog' : 'Add New Product' }}
      </button>
    </div>

    <!-- Add Product Form -->
    <div *ngIf="showAddForm" class="bg-gray-50 p-8 border border-gray-100 mb-12">
       <h2 class="text-xl font-bold text-gray-900 uppercase tracking-widest mb-8">Create New Product</h2>
       <form [formGroup]="productForm" (ngSubmit)="onSubmit()" class="grid grid-cols-1 md:grid-cols-2 gap-8">
          <div>
             <label class="block text-xs font-bold text-gray-900 uppercase tracking-widest mb-2">Product Name</label>
             <input type="text" formControlName="name" class="w-full bg-white px-4 py-3 border border-gray-200 focus:outline-none focus:ring-1 focus:ring-gray-900 text-sm">
          </div>
          <div>
            <label class="block text-xs font-bold text-gray-900 uppercase tracking-widest mb-2">Category</label>
            <select formControlName="category" class="w-full bg-white px-4 py-3 border border-gray-200 focus:outline-none focus:ring-1 focus:ring-gray-900 text-sm appearance-none">
               <option value="Men">Men</option>
               <option value="Women">Women</option>
               <option value="Kids">Kids</option>
            </select>
          </div>
          <div class="md:col-span-2">
            <label class="block text-xs font-bold text-gray-900 uppercase tracking-widest mb-2">Description</label>
            <textarea formControlName="description" rows="3" class="w-full bg-white px-4 py-3 border border-gray-200 focus:outline-none focus:ring-1 focus:ring-gray-900 text-sm"></textarea>
          </div>
          <div>
            <label class="block text-xs font-bold text-gray-900 uppercase tracking-widest mb-2">Price (D)</label>
            <input type="number" formControlName="price" class="w-full bg-white px-4 py-3 border border-gray-200 focus:outline-none focus:ring-1 focus:ring-gray-900 text-sm">
          </div>
          <div>
            <label class="block text-xs font-bold text-gray-900 uppercase tracking-widest mb-2">Stock Quantity</label>
            <input type="number" formControlName="stockQuantity" class="w-full bg-white px-4 py-3 border border-gray-200 focus:outline-none focus:ring-1 focus:ring-gray-900 text-sm">
          </div>
          <div class="md:col-span-2">
             <button type="submit" [disabled]="loading" class="w-full bg-gray-900 text-white py-5 text-sm font-bold uppercase tracking-widest hover:bg-gray-800 transition-all disabled:bg-gray-400">
                {{ loading ? 'Creating...' : 'Launch Product' }}
             </button>
          </div>
       </form>
    </div>

    <!-- Product Table -->
    <div *ngIf="!showAddForm" class="overflow-x-auto">
      <table class="w-full text-left border-collapse">
        <thead>
          <tr class="bg-gray-50 border-b border-gray-200">
            <th class="px-6 py-4 text-xs font-black uppercase tracking-widest text-gray-400">Thumbnail</th>
            <th class="px-6 py-4 text-xs font-black uppercase tracking-widest text-gray-400">Details</th>
            <th class="px-6 py-4 text-xs font-black uppercase tracking-widest text-gray-400">Price</th>
            <th class="px-6 py-4 text-xs font-black uppercase tracking-widest text-gray-400">Stock</th>
            <th class="px-6 py-4 text-xs font-black uppercase tracking-widest text-gray-400 text-right">Actions</th>
          </tr>
        </thead>
        <tbody class="divide-y divide-gray-100">
          <tr *ngFor="let product of products" class="hover:bg-gray-50 transition-colors">
            <td class="px-6 py-8">
              <img [src]="product.images[0]?.url" class="w-16 h-20 object-cover border border-gray-100">
            </td>
            <td class="px-6 py-8">
              <p class="text-sm font-bold text-gray-900 uppercase tracking-widest">{{ product.name }}</p>
              <p class="text-xs text-gray-400 mt-1 uppercase">{{ product.category }} | {{ product.type }}</p>
            </td>
            <td class="px-6 py-8 font-bold text-sm text-gray-900">D{{ product.price | number:'1.2-2' }}</td>
            <td class="px-6 py-8">
               <span [ngClass]="product.stockQuantity > 5 ? 'text-green-600' : 'text-red-600'" class="text-xs font-bold uppercase tracking-widest">
                  {{ product.stockQuantity }} in stock
               </span>
            </td>
            <td class="px-6 py-8 text-right">
              <div class="flex justify-end gap-4">
                 <button (click)="onDelete(product._id)" class="text-xs font-bold text-gray-400 hover:text-red-600 uppercase tracking-widest transition-colors">Delete</button>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
