<div class="min-h-[80vh] flex flex-col items-center justify-center px-4">
    <div class="w-full max-w-md">
        <!-- Title -->
        <div class="flex items-center justify-center gap-3 mb-8">
            <h1 class="text-3xl font-medium text-foreground uppercase tracking-tight">
                Sign Up
            </h1>
            <span class="w-10 h-[2px] bg-foreground"></span>
        </div>

        <!-- Form -->
        <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="space-y-4">

            <div class="space-y-1">
                <input type="text" formControlName="name" placeholder="Name"
                    [class.border-destructive]="isFieldInvalid('name')"
                    class="w-full px-4 py-3 bg-background border border-gray-800 text-foreground placeholder:text-muted-foreground focus:outline-none transition-colors" />
                <p *ngIf="isFieldInvalid('name')" class="text-destructive text-xs animate-fade-in">
                    Please enter your name (min 2 characters).
                </p>
            </div>

            <div class="space-y-1">
                <input type="email" formControlName="email" placeholder="Email"
                    [class.border-destructive]="isFieldInvalid('email')"
                    class="w-full px-4 py-3 bg-background border border-gray-800 text-foreground placeholder:text-muted-foreground focus:outline-none transition-colors" />
                <p *ngIf="isFieldInvalid('email')" class="text-destructive text-xs animate-fade-in">
                    Please enter a valid email address.
                </p>
            </div>

            <div class="space-y-1">
                <input type="password" formControlName="password" placeholder="Password"
                    [class.border-destructive]="isFieldInvalid('password')"
                    class="w-full px-4 py-3 bg-background border border-gray-800 text-foreground placeholder:text-muted-foreground focus:outline-none transition-colors" />
                <p *ngIf="isFieldInvalid('password')" class="text-destructive text-xs animate-fade-in">
                    Password must be at least 8 characters.
                </p>
            </div>

            <!-- Links -->
            <div class="flex items-center justify-between text-sm text-gray-600">
                <a routerLink="/forgot-password" class="hover:text-foreground transition-colors cursor-pointer">
                    Forgot your password?
                </a>
                <a routerLink="/login" class="hover:text-foreground transition-colors cursor-pointer">
                    Login Here
                </a>
            </div>

            <!-- Submit Button -->
            <div class="pt-4 flex justify-center">
                <button type="submit" [disabled]="loading"
                    class="px-10 py-2.5 bg-black text-white text-sm font-medium uppercase tracking-widest hover:bg-gray-800 transition-colors disabled:opacity-50 disabled:cursor-not-allowed flex items-center gap-2">
                    <span *ngIf="loading"
                        class="w-4 h-4 border-2 border-white/20 border-t-white rounded-full animate-spin"></span>
                    {{ loading ? 'Creating Account...' : 'Sign Up' }}
                </button>
            </div>
        </form>
    </div>
</div>
