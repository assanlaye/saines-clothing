<div class="space-y-6">
    <h2 class="text-base text-gray-500 font-medium tracking-tight mb-4 lowercase first-letter:uppercase">All Products
        List</h2>

    <div class="bg-white border border-gray-100 overflow-hidden">
        <table class="w-full text-sm text-left">
            <thead
                class="bg-gray-50 text-[11px] font-bold text-gray-500 uppercase tracking-wider border-b border-gray-200">
                <tr>
                    <th class="px-6 py-4 font-bold">Image</th>
                    <th class="px-6 py-4 font-bold">Name</th>
                    <th class="px-6 py-4 font-bold">Category</th>
                    <th class="px-6 py-4 font-bold">Price</th>
                    <th class="px-6 py-4 text-center font-bold">Action</th>
                </tr>
            </thead>
            <tbody class="divide-y divide-gray-100">
                <tr *ngFor="let product of products" class="hover:bg-gray-50 transition-colors">
                    <td class="px-6 py-4">
                        <img [src]="product.image[0]" class="w-12 h-12 object-contain" alt="">
                    </td>
                    <td class="px-6 py-4 text-gray-700">{{product.name}}</td>
                    <td class="px-6 py-4 text-gray-600">{{product.category}}</td>
                    <td class="px-6 py-4 text-gray-900 font-medium">D{{product.price}}</td>
                    <td class="px-6 py-4 text-center">
                        <button (click)="deleteProduct(product._id)"
                            class="p-1 hover:bg-red-50 text-gray-500 hover:text-red-500 transition-all rounded">
                            <lucide-icon [name]="X" class="w-5 h-5"></lucide-icon>
                        </button>
                    </td>
                </tr>
            </tbody>
        </table>

        <div *ngIf="products.length === 0" class="p-20 text-center text-gray-400">
            No products found in the database.
        </div>
    </div>
</div>
