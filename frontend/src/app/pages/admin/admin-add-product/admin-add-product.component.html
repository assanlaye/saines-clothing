<div class="space-y-8 animate-fade-in">
    <div class="space-y-6">
        <label class="text-gray-500 font-medium text-base lowercase first-letter:uppercase">Upload Image</label>
        <div class="flex gap-4">
            <div *ngFor="let preview of imagePreviews; let i = index" class="relative group">
                <input type="file" (change)="onFileChange($event, i)" accept="image/*"
                    class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10">
                <div
                    class="w-20 h-24 border-2 border-dashed border-gray-200 flex items-center justify-center bg-gray-50 overflow-hidden group-hover:border-pink-300 transition-colors">
                    <img *ngIf="preview" [src]="preview" class="w-full h-full object-contain">
                    <img *ngIf="!preview" src="assets/admin_assets/upload_area.png"
                        class="w-8 h-8 opacity-40 group-hover:opacity-60 transition-opacity" alt="">
                </div>
            </div>
        </div>
    </div>

    <form [formGroup]="productForm" (ngSubmit)="onSubmit()" class="max-w-xl space-y-6">
        <div class="space-y-2">
            <label class="block text-gray-500 font-medium lowercase first-letter:uppercase">Product name</label>
            <input type="text" formControlName="name" placeholder="Type here"
                class="w-full px-4 py-2 border border-gray-300 rounded outline-none focus:border-pink-400 transition-colors">
        </div>

        <div class="space-y-2">
            <label class="block text-gray-500 font-medium lowercase first-letter:uppercase">Product description</label>
            <textarea formControlName="description" rows="4" placeholder="Write content here"
                class="w-full px-4 py-2 border border-gray-300 rounded outline-none focus:border-pink-400 transition-colors"></textarea>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <div class="space-y-2">
                <label class="block text-gray-500 font-medium lowercase first-letter:uppercase">Product category</label>
                <select formControlName="category"
                    class="w-full px-3 py-2 border border-gray-300 rounded outline-none bg-white cursor-pointer">
                    <option value="Men">Men</option>
                    <option value="Women">Women</option>
                    <option value="Kids">Kids</option>
                </select>
            </div>

            <div class="space-y-2">
                <label class="block text-gray-500 font-medium lowercase first-letter:uppercase">Sub category</label>
                <select formControlName="subCategory"
                    class="w-full px-3 py-2 border border-gray-300 rounded outline-none bg-white cursor-pointer">
                    <option value="Topwear">Topwear</option>
                    <option value="Bottomwear">Bottomwear</option>
                    <option value="Winterwear">Winterwear</option>
                </select>
            </div>

            <div class="space-y-2">
                <label class="block text-gray-500 font-medium lowercase first-letter:uppercase">Product Price</label>
                <input type="number" formControlName="price" placeholder="25"
                    class="w-full px-4 py-2 border border-gray-300 rounded outline-none focus:border-pink-400 transition-colors">
            </div>
        </div>

        <div class="space-y-4">
            <label class="block text-gray-500 font-medium lowercase first-letter:uppercase">Product Sizes</label>
            <div class="flex gap-3">
                <button type="button" *ngFor="let size of availableSizes" (click)="toggleSize(size)"
                    [class.bg-pink-100]="selectedSizes.includes(size)"
                    [class.border-pink-400]="selectedSizes.includes(size)"
                    class="w-12 h-10 border border-gray-200 flex items-center justify-center font-medium bg-gray-50 hover:bg-white transition-all">
                    {{size}}
                </button>
            </div>
        </div>

        <div class="flex items-center gap-3">
            <input type="checkbox" formControlName="bestseller" id="bestseller"
                class="w-4 h-4 accent-pink-500 cursor-pointer">
            <label for="bestseller" class="text-sm text-gray-600 cursor-pointer">Add to bestseller</label>
        </div>

        <button type="submit" [disabled]="loading"
            class="px-10 py-3 bg-black text-white text-sm font-medium uppercase tracking-wider hover:bg-stone-800 transition-all rounded disabled:opacity-50">
            {{ loading ? 'Adding...' : 'ADD' }}
        </button>
    </form>
</div>
