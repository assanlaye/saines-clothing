<div class="min-h-screen bg-white">
    <!-- Navbar -->
    <header
        class="border-b border-gray-200 px-4 sm:px-6 lg:px-8 h-16 flex justify-between items-center bg-white sticky top-0 z-50">
        <div class="flex flex-col">
            <a routerLink="/" class="flex items-center gap-2">
                <img src="assets/saine-clothing_logo.svg" alt="Admin Logo" class="w-28 object-contain" />
            </a>
        </div>
        <button (click)="logout()"
            class="px-8 py-2 bg-[#414652] text-white rounded-full text-sm font-medium hover:bg-opacity-90 transition-all">
            Logout
        </button>
    </header>

    <div class="flex">
        <!-- Sidebar -->
        <aside class="w-64 border-r border-gray-200 min-h-[calc(100vh-80px)] p-6 sticky top-20 bg-white">
            <nav class="space-y-3">
                <a routerLink="/admin/add-product" routerLinkActive="admin-nav-active"
                    class="flex items-center gap-3 px-4 py-3 rounded-lg border border-gray-200 text-gray-700 hover:bg-gray-50 transition-all group border-r-0 rounded-r-none -mr-6">
                    <img src="assets/admin_assets/add_icon.png" class="w-5 h-5" alt="">
                    <span class="text-sm font-medium">Add Items</span>
                </a>
                <a routerLink="/admin/products" routerLinkActive="admin-nav-active"
                    class="flex items-center gap-3 px-4 py-3 rounded-lg border border-gray-200 text-gray-700 hover:bg-gray-50 transition-all group border-r-0 rounded-r-none -mr-6">
                    <img src="assets/admin_assets/order_icon.png" class="w-5 h-5" alt="">
                    <span class="text-sm font-medium">List Items</span>
                </a>
                <a routerLink="/admin/orders" routerLinkActive="admin-nav-active"
                    class="flex items-center gap-3 px-4 py-3 rounded-lg border border-gray-200 text-gray-700 hover:bg-gray-50 transition-all group border-r-0 rounded-r-none -mr-6">
                    <img src="assets/admin_assets/order_icon.png" class="w-5 h-5" alt="">
                    <span class="text-sm font-medium">Orders</span>
                </a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 bg-white p-8 overflow-x-hidden">
            <router-outlet></router-outlet>
        </main>
    </div>
</div>
