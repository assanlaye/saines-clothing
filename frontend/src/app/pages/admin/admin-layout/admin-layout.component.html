<div class="min-h-screen bg-white">
    <!-- Navbar -->
    <header
        class="border-b border-gray-200 px-4 sm:px-6 lg:px-8 h-16 flex justify-between items-center bg-white sticky top-0 z-50">
        <div class="flex items-center gap-3">
            <button (click)="toggleSidebar()" class="md:hidden px-3 py-2 border rounded-md">Menu</button>
            <a routerLink="/" class="flex items-center gap-2">
                <img src="assets/saine-clothing_logo.svg" alt="Admin Logo" class="w-20 sm:w-28 object-contain" />
            </a>
        </div>
        <button (click)="logout()"
            class="px-8 py-2 bg-[#414652] text-white rounded-full text-sm font-medium hover:bg-opacity-90 transition-all">
            Logout
        </button>
    </header>

        <div class="flex">
        <!-- Desktop Sidebar -->
        <aside class="hidden md:block w-64 border-r border-gray-200 min-h-[calc(100vh-80px)] p-6 sticky top-20 bg-white">
            <nav class="space-y-3">
                <a routerLink="/admin/add-product" routerLinkActive="admin-nav-active"
                    class="flex items-center gap-3 px-4 py-3 rounded-lg border border-gray-200 text-gray-700 hover:bg-gray-50 transition-all group border-r-0 rounded-r-none -mr-6">
                    <img src="assets/admin_assets/add_icon.png" class="w-5 h-5" alt="">
                    <span class="text-sm font-medium">Add Items</span>
                </a>
                <a routerLink="/admin/products" routerLinkActive="admin-nav-active"
                    class="flex items-center gap-3 px-4 py-3 rounded-lg border border-gray-200 text-gray-700 hover:bg-gray-50 transition-all group border-r-0 rounded-r-none -mr-6">
                    <img src="assets/admin_assets/order_icon.png" class="w-5 h-5" alt="">
                    <span class="text-sm font-medium">List Items</span>
                </a>
                <a routerLink="/admin/orders" routerLinkActive="admin-nav-active"
                    class="flex items-center gap-3 px-4 py-3 rounded-lg border border-gray-200 text-gray-700 hover:bg-gray-50 transition-all group border-r-0 rounded-r-none -mr-6">
                    <img src="assets/admin_assets/order_icon.png" class="w-5 h-5" alt="">
                    <span class="text-sm font-medium">Orders</span>
                </a>
            </nav>
        </aside>

        <!-- Mobile sidebar & overlay -->
        <div *ngIf="isSidebarOpen" class="fixed inset-0 z-40 md:hidden">
            <div class="absolute inset-0 bg-black/50" (click)="closeSidebar()"></div>
            <aside class="relative w-64 bg-white h-full border-r border-gray-200 p-6">
                <div class="flex items-center justify-between mb-4">
                    <a routerLink="/" class="flex items-center gap-2">
                        <img src="assets/saine-clothing_logo.svg" alt="Admin Logo" class="w-20 object-contain" />
                    </a>
                    <button (click)="closeSidebar()" class="p-2 rounded-md">Close</button>
                </div>
                <nav class="space-y-3">
                    <a routerLink="/admin/add-product" routerLinkActive="admin-nav-active"
                        class="flex items-center gap-3 px-4 py-3 rounded-lg border border-gray-200 text-gray-700 hover:bg-gray-50 transition-all group">
                        <img src="assets/admin_assets/add_icon.png" class="w-5 h-5" alt="">
                        <span class="text-sm font-medium">Add Items</span>
                    </a>
                    <a routerLink="/admin/products" routerLinkActive="admin-nav-active"
                        class="flex items-center gap-3 px-4 py-3 rounded-lg border border-gray-200 text-gray-700 hover:bg-gray-50 transition-all group">
                        <img src="assets/admin_assets/order_icon.png" class="w-5 h-5" alt="">
                        <span class="text-sm font-medium">List Items</span>
                    </a>
                    <a routerLink="/admin/orders" routerLinkActive="admin-nav-active"
                        class="flex items-center gap-3 px-4 py-3 rounded-lg border border-gray-200 text-gray-700 hover:bg-gray-50 transition-all group">
                        <img src="assets/admin_assets/order_icon.png" class="w-5 h-5" alt="">
                        <span class="text-sm font-medium">Orders</span>
                    </a>
                </nav>
            </aside>
        </div>

        <!-- Main Content -->
        <main class="flex-1 bg-white p-8 overflow-x-hidden">
            <router-outlet></router-outlet>
        </main>
    </div>
</div>
