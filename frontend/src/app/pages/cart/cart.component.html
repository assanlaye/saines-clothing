<div class="min-h-screen bg-background">
    <main class="container mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <!-- Breadcrumb -->
        <div class="flex items-center gap-2 text-sm text-muted-foreground mb-8">
            <a routerLink="/" class="hover:text-foreground">HOME</a>
            <lucide-icon [name]="ChevronRight" class="w-4 h-4"></lucide-icon>
            <span class="text-foreground">CART</span>
        </div>

        <!-- Title -->
        <div class="flex items-center gap-3 mb-8">
            <h1 class="section-title">
                YOUR <span class="text-muted-foreground">CART</span>
            </h1>
            <span class="w-10 h-px bg-foreground"></span>
        </div>

        <div *ngIf="cartItems.length === 0; else cartContent" class="text-center py-16">
            <p class="text-muted-foreground mb-6">Your cart is empty</p>
            <a routerLink="/collection"
                class="inline-block px-8 py-3 bg-primary text-primary-foreground text-sm font-medium uppercase tracking-wider hover:bg-primary/90 transition-colors">
                Continue Shopping
            </a>
        </div>

        <ng-template #cartContent>
            <div class="grid lg:grid-cols-3 gap-8">
                <!-- Cart Items -->
                <div class="lg:col-span-2 space-y-4">
                    <div *ngFor="let item of cartItems" class="flex gap-4 py-4 border-t border-b border-border">
                        <!-- Product Image -->
                        <a [routerLink]="['/product', item._id]" class="w-20 h-24 flex-shrink-0">
                            <img [src]="getImageUrl(item.image)" [alt]="item.name" class="w-full h-full object-cover" />
                        </a>

                        <!-- Product Info -->
                        <div class="flex-1 flex flex-col justify-between">
                            <div>
                                <a [routerLink]="['/product', item._id]"
                                    class="text-sm font-medium text-foreground hover:underline">
                                    {{ item.name }}
                                </a>
                                <div class="flex items-center gap-4 mt-2">
                                    <span class="text-sm text-foreground">D{{ item.price }}</span>
                                    <span class="text-xs px-2 py-1 bg-secondary text-secondary-foreground">
                                        {{ item.size }}
                                    </span>
                                </div>
                            </div>

                            <!-- Quantity -->
                            <div class="flex items-center gap-4 mt-3">
                                <input type="number" min="1" [value]="item.quantity"
                                    (change)="updateQuantity(item._id, item.size, $event)"
                                    class="w-16 px-2 py-1 border border-border text-center text-sm focus:outline-none focus:border-foreground" />
                            </div>
                        </div>

                        <!-- Delete Button -->
                        <button (click)="remove(item._id, item.size)"
                            class="self-start p-2 text-muted-foreground hover:text-destructive transition-colors">
                            <lucide-icon [name]="Trash2" class="w-4 h-4"></lucide-icon>
                        </button>
                    </div>
                </div>

                <!-- Cart Totals -->
                <div class="lg:col-span-1">
                    <div class="border border-border p-6">
                        <h2 class="text-lg font-medium text-foreground mb-6">CART TOTALS</h2>

                        <div class="space-y-4">
                            <div class="flex justify-between text-sm">
                                <span class="text-muted-foreground">Subtotal</span>
                                <span class="text-foreground">D{{ subtotal.toFixed(2) }}</span>
                            </div>

                            <div class="border-t border-border"></div>

                            <div class="flex justify-between text-sm">
                                <span class="text-muted-foreground">Delivery Fee</span>
                                <span class="text-foreground">D{{ DELIVERY_FEE.toFixed(2) }}</span>
                            </div>

                            <div class="border-t border-border"></div>

                            <div class="flex justify-between">
                                <span class="font-medium text-foreground">Total</span>
                                <span class="font-medium text-foreground">D{{ total.toFixed(2) }}</span>
                            </div>
                        </div>

                        <a routerLink="/place-order"
                            class="block w-full mt-6 px-8 py-3 bg-primary text-primary-foreground text-sm font-medium uppercase tracking-wider text-center hover:bg-primary/90 transition-colors">
                            Proceed to Checkout
                        </a>
                    </div>
                </div>
            </div>
        </ng-template>
    </main>
</div>
