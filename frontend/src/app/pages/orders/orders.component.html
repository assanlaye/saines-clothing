<div class="container mx-auto px-4 sm:px-6 lg:px-8 py-12">
    <!-- Title -->
    <div class="flex items-center gap-3 mb-10">
        <h2 class="section-title">
            MY <span class="text-muted-foreground">ORDERS</span>
        </h2>
        <span class="w-10 h-px bg-foreground"></span>
    </div>

    <!-- Orders List -->
    <div class="space-y-6">
        <div *ngFor="let item of orders"
            class="border-t border-b py-6 flex flex-col md:flex-row md:items-center justify-between gap-6 hover:bg-secondary/50 transition-colors">
            <div class="flex gap-6">
                <img [src]="item.image" [alt]="item.name" class="w-20 h-24 object-cover">
                <div class="space-y-1">
                    <p class="text-lg font-medium">{{ item.name }}</p>
                    <div class="flex items-center gap-4 text-sm text-muted-foreground">
                        <p>${{ item.price }}</p>
                        <p>Quantity: {{ item.quantity }}</p>
                        <p>Size: {{ item.size }}</p>
                    </div>
                    <div class="text-sm text-muted-foreground pt-1">
                        <p>Date: <span class="text-foreground">{{ formatDate(item.date) }}</span></p>
                        <p>Payment: <span class="text-foreground">{{ item.paymentMethod }}</span></p>
                    </div>
                </div>
            </div>

            <div class="flex flex-col md:flex-row md:items-center gap-8 md:gap-16">
                <!-- Status -->
                <div class="flex items-center gap-2">
                    <span class="w-2 h-2 rounded-full bg-green-500"></span>
                    <span class="text-sm font-medium">{{ item.status }}</span>
                </div>

                <!-- Track Button -->
                <button
                    class="px-6 py-2 border border-gray-200 text-sm font-medium hover:bg-black hover:text-white transition-all duration-300">
                    Track Order
                </button>
            </div>
        </div>

        <!-- Empty State -->
        <div *ngIf="orders.length === 0" class="text-center py-20">
            <p class="text-muted-foreground italic">You haven't placed any orders yet.</p>
            <a routerLink="/collection"
                class="inline-block mt-4 px-8 py-2 bg-black text-white text-sm uppercase tracking-widest hover:bg-gray-800 transition-colors">
                Start Shopping
            </a>
        </div>
    </div>
</div>
