<div class="min-h-screen bg-background">
    <main class="container mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <!-- Breadcrumb -->
        <div class="flex items-center gap-2 text-sm text-muted-foreground mb-8">
            <span>HOME</span>
            <lucide-icon [name]="ChevronRight" class="w-4 h-4"></lucide-icon>
            <span class="text-foreground">COLLECTION</span>
        </div>
         <!-- Search Bar -->
        <div class="relative mb-8 flex justify-center">
            <input #searchInput type="text" [(ngModel)]="searchQuery" (keyup.enter)="applyFilters()"
                placeholder="Search"
                class="w-1/2 pl-4 pr-12 py-2 rounded-full border border-border bg-background text-foreground placeholder:text-muted-foreground focus:outline-none focus:border-foreground transition-colors" />
            <button type="button" (click)="applyFilters()"
                class="absolute right-[calc(25%+1rem)] top-1/2 -translate-y-1/2 p-1.5 hover:bg-secondary rounded-full transition-colors">
                <lucide-icon [name]="Search"
                    class="w-5 h-5 text-foreground"></lucide-icon>
            </button>
            <button type="button" (click)="closeSearchBar()"
                class="absolute right-[calc(25%-2rem)] top-1/2 -translate-y-1/2 p-1.5 hover:bg-secondary rounded-full transition-colors">
                <lucide-icon [name]="X"
                    class="w-5 h-5 text-foreground"></lucide-icon>
            </button>
        </div>


        <div class="flex flex-col lg:flex-row gap-8">
            <!-- Sidebar Filters -->
            <aside class="lg:w-64 flex-shrink-0"
                [ngClass]="{'block': showFilter, 'hidden': !showFilter, 'lg:block': true}">
                <!-- Mobile close button -->
                <div class="lg:hidden flex justify-between items-center mb-4">
                    <h3 class="font-medium text-foreground">Filters</h3>
                    <button (click)="showFilter = false">
                        <lucide-icon [name]="X" class="w-5 h-5"></lucide-icon>
                    </button>
                </div>

                <!-- Categories Filter -->
                <div class="border border-border p-4 mb-4">
                    <h3 class="text-sm font-medium text-foreground mb-4 uppercase tracking-wider">
                        Categories
                    </h3>
                    <div class="space-y-3">
                        <label *ngFor="let category of categories" class="flex items-center gap-3 cursor-pointer">
                            <input type="checkbox" [checked]="selectedCategories.includes(category)"
                                (change)="toggleCategory(category)"
                                class="w-4 h-4 rounded-none border-border accent-foreground" />
                            <span class="text-sm text-muted-foreground">
                                {{ category }}
                            </span>
                        </label>
                    </div>
                </div>

                <!-- Type Filter -->
                <div class="border border-border p-4">
                    <h3 class="text-sm font-medium text-foreground mb-4 uppercase tracking-wider">
                        Type
                    </h3>
                    <div class="space-y-3">
                        <label *ngFor="let type of types" class="flex items-center gap-3 cursor-pointer">
                            <input type="checkbox" [checked]="selectedTypes.includes(type)" (change)="toggleType(type)"
                                class="w-4 h-4 rounded-none border-border accent-foreground" />
                            <span class="text-sm text-muted-foreground">{{ type }}</span>
                        </label>
                    </div>
                </div>
            </aside>

            <!-- Main Content -->
            <div class="flex-1">
                <!-- Header with Search and Sort -->
                <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 mb-8">
                    <div class="flex items-center gap-3">
                        <h1 class="section-title">
                            ALL <span class="text-muted-foreground">COLLECTIONS</span>
                        </h1>
                        <span class="w-10 h-px bg-foreground hidden sm:block"></span>
                    </div>

                    <div class="flex items-center gap-4 w-full sm:w-auto">
                        <!-- Mobile Filter Toggle -->
                        <button (click)="showFilter = !showFilter"
                            class="lg:hidden flex items-center gap-2 px-4 py-2 border border-border text-sm">
                            <lucide-icon [name]="SlidersHorizontal" class="w-4 h-4"></lucide-icon>
                            Filters
                        </button>

                        <!-- Sort Dropdown -->
                        <select [(ngModel)]="sortBy" (change)="applyFilters()"
                            class="px-4 py-2 border border-border bg-background text-sm text-foreground focus:outline-none focus:border-foreground">
                            <option value="relevant">Sort by: Relevant</option>
                            <option value="low-high">Sort by: Low to High</option>
                            <option value="high-low">Sort by: High to Low</option>
                        </select>
                    </div>
                </div>

               
                <!-- Products Grid -->
                <div *ngIf="filteredProducts.length > 0; else noProducts"
                    class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-4 md:gap-6">
                    <div *ngFor="let product of filteredProducts; let i = index" class="animate-fade-in"
                        [style.animation-delay]="(i * 0.05) + 's'">
                        <app-product-card [id]="product._id" [name]="product.name" [price]="product.price"
                            [image]="product.image"></app-product-card>
                    </div>
                </div>

                <ng-template #noProducts>
                    <div class="text-center py-16">
                        <p class="text-muted-foreground">
                            No products found matching your criteria.
                        </p>
                    </div>
                </ng-template>

                <!-- Results Count -->
                <div class="mt-8 text-sm text-muted-foreground text-center">
                    Showing {{ filteredProducts.length }} of {{ allProducts.length }} products
                </div>
            </div>
        </div>
    </main>
</div>
