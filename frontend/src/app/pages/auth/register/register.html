<div class="auth-page">
  <div class="auth-container">
    <div class="auth-card">
      <h1>Sign Up</h1>
      <p class="subtitle">Create your account to start shopping</p>

      @if (error) {
        <div class="error-message">{{ error }}</div>
      }

      <form (ngSubmit)="onSubmit()" class="auth-form">
        <div class="form-row">
          <div class="form-group">
            <label for="firstName">First Name</label>
            <input
              type="text"
              id="firstName"
              [(ngModel)]="firstName"
              name="firstName"
              required
              placeholder="First name"
              class="form-input"
            />
          </div>

          <div class="form-group">
            <label for="lastName">Last Name</label>
            <input
              type="text"
              id="lastName"
              [(ngModel)]="lastName"
              name="lastName"
              required
              placeholder="Last name"
              class="form-input"
            />
          </div>
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input
            type="email"
            id="email"
            [(ngModel)]="email"
            name="email"
            required
            placeholder="Enter your email"
            class="form-input"
          />
        </div>

        <div class="form-group">
          <label for="phone">Phone Number</label>
          <input
            type="tel"
            id="phone"
            [(ngModel)]="phone"
            name="phone"
            required
            placeholder="Enter your phone number"
            class="form-input"
          />
        </div>

        <div class="form-group">
          <label for="city">City</label>
          <input
            type="text"
            id="city"
            [(ngModel)]="city"
            name="city"
            required
            placeholder="Enter your city"
            class="form-input"
          />
        </div>

        <div class="form-group">
          <label for="homeAddress">Home Address</label>
          <input
            type="text"
            id="homeAddress"
            [(ngModel)]="homeAddress"
            name="homeAddress"
            required
            placeholder="Enter your home address"
            class="form-input"
          />
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            [(ngModel)]="password"
            name="password"
            required
            placeholder="Enter your password (min 6 characters)"
            class="form-input"
          />
        </div>

        <div class="form-group">
          <label for="confirmPassword">Confirm Password</label>
          <input
            type="password"
            id="confirmPassword"
            [(ngModel)]="confirmPassword"
            name="confirmPassword"
            required
            placeholder="Confirm your password"
            class="form-input"
          />
        </div>

        <button type="submit" [disabled]="isLoading" class="btn btn-primary btn-full">
          {{ isLoading ? 'Creating account...' : 'Sign Up' }}
        </button>
      </form>

      <div class="auth-footer">
        <p>Already have an account? <a routerLink="/auth/login">Login here</a></p>
      </div>
    </div>
  </div>
</div>
