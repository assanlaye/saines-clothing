<header class="header">
  <div class="header-container">
    <!-- Logo -->
    <div class="logo-section">
      <a routerLink="/" class="logo-link">
        <img src="/assets/logo.png" alt="Saine Clothing" class="logo" />
      </a>
    </div>

    <!-- Navigation -->
    <nav class="nav" [class.menu-open]="isMenuOpen()">
      <ul class="nav-list">
        <li><a routerLink="/" (click)="closeMenu()">Home</a></li>
        <li>
          <a routerLink="/products" [queryParams]="{category: 'Men'}" (click)="closeMenu()">Men</a>
        </li>
        <li>
          <a routerLink="/products" [queryParams]="{category: 'Women'}" (click)="closeMenu()">Women</a>
        </li>
        <li>
          <a routerLink="/products" [queryParams]="{category: 'Kids'}" (click)="closeMenu()">Kids</a>
        </li>
        <li><a routerLink="/products" (click)="closeMenu()">All Products</a></li>
      </ul>
    </nav>

    <!-- Right Side Actions -->
    <div class="header-actions">
      <!-- Search -->
      <div class="search-box">
        <input 
          type="text" 
          placeholder="Search products..." 
          [value]="searchQuery()"
          (input)="searchQuery.set($any($event.target).value)"
          (keyup.enter)="onSearch()"
          class="search-input"
        />
        <button (click)="onSearch()" class="search-btn" aria-label="Search">
          <img src="/assets/search_icon.png" alt="Search" />
        </button>
      </div>

      <!-- Cart -->
      <a routerLink="/cart" class="icon-link cart-link">
        <img src="/assets/cart_icon.png" alt="Cart" />
        @if (cartCount() > 0) {
          <span class="badge">{{ cartCount() }}</span>
        }
      </a>

      <!-- User Account -->
      @if (isAuthenticated()) {
        <div class="user-menu">
          <a routerLink="/profile" class="icon-link">
            <img src="/assets/profile_icon.png" alt="Profile" />
          </a>
          <div class="dropdown">
            <span class="username">{{ userName }}</span>
            <a routerLink="/profile" (click)="closeMenu()">Profile</a>
            @if (currentUser()?.role === 'admin') {
              <a routerLink="/admin" (click)="closeMenu()">Admin</a>
            }
            <a (click)="logout()">Logout</a>
          </div>
        </div>
      } @else {
        <div class="auth-links">
          <a routerLink="/auth/login" class="auth-link">Login</a>
          <a routerLink="/auth/register" class="auth-link btn-primary">Sign Up</a>
        </div>
      }

      <!-- Mobile Menu Toggle -->
      <button class="menu-toggle" (click)="toggleMenu()" aria-label="Toggle menu">
        <img [src]="isMenuOpen() ? '/assets/cross_icon.png' : '/assets/menu_icon.png'" alt="Menu" />
      </button>
    </div>
  </div>
</header>
