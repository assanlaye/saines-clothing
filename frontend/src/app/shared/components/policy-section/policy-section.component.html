<section class="py-16 border-t border-border">
    <div class="container mx-auto px-4 sm:px-6 lg:px-8">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
            <div *ngFor="let policy of policies" class="policy-card">
                <div class="p-4 bg-secondary rounded-full mb-4">
                    <lucide-icon [name]="policy.icon" class="w-6 h-6 text-foreground"></lucide-icon>
                </div>
                <h3 class="text-sm font-semibold text-foreground mb-1">{{ policy.title }}</h3>
                <p class="text-xs text-muted-foreground">{{ policy.description }}</p>
            </div>
        </div>
    </div>
</section>
