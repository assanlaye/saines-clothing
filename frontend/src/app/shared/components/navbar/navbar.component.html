<nav class="sticky top-0 z-50 bg-background/95 backdrop-blur-sm border-b border-border">
  <div class="container mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex items-center justify-between h-16">
      <!-- Logo -->
      <a routerLink="/" class="flex items-center gap-2">
        <img src="assets/saine-clothing_logo.svg" alt="Saine's Clothing Logo" class="w-28 object-contain" />
      </a>

      <!-- Desktop Navigation -->
      <div class="hidden md:flex items-center gap-8">
        <ng-container *ngFor="let link of navLinks">
          <a [routerLink]="link.path" class="nav-link relative" [class.nav-link-active]="isActive(link.path)">
            {{ link.name }}
            <span *ngIf="isActive(link.path)" class="block w-1/2 h-0.5 bg-foreground mx-auto mt-1"></span>
          </a>
        </ng-container>
      </div>

      <!-- Icons -->
      <div class="flex items-center gap-4">
        <button class="p-2 hover:bg-secondary rounded-full transition-colors">
          <lucide-icon [name]="Search" class="w-5 h-5 text-foreground"></lucide-icon>
        </button>
        <!-- Profile Icon / Dropdown -->
        <div class="relative group">
          <button (click)="isLoggedIn ? isProfileOpen = !isProfileOpen : router.navigate(['/login'])"
            class="p-2 hover:bg-secondary rounded-full transition-colors flex items-center gap-1">
            <lucide-icon [name]="User" class="w-5 h-5 text-foreground"></lucide-icon>
          </button>

          <!-- Dropdown Menu -->
          <div *ngIf="isLoggedIn && isProfileOpen"
            class="absolute right-0 mt-2 w-40 bg-white border border-gray-100 shadow-lg py-2 z-50 animate-in fade-in slide-in-from-top-2 duration-200">
            <a *ngIf="isAdmin" routerLink="/admin" (click)="isProfileOpen = false"
              class="block px-4 py-2 text-sm text-gray-600 hover:bg-gray-50 hover:text-foreground transition-colors border-b border-gray-100 font-semibold">
              Admin Panel
            </a>
            <a routerLink="/orders" (click)="isProfileOpen = false"
              class="block px-4 py-2 text-sm text-gray-600 hover:bg-gray-50 hover:text-foreground transition-colors">
              Orders
            </a>
            <button (click)="logout()"
              class="w-full text-left px-4 py-2 text-sm text-gray-600 hover:bg-gray-50 hover:text-foreground transition-colors">
              Logout
            </button>
          </div>
        </div>
        <a routerLink="/cart" class="p-2 hover:bg-secondary rounded-full transition-colors relative">
          <lucide-icon [name]="ShoppingBag" class="w-5 h-5 text-foreground"></lucide-icon>
          <span *ngIf="cartCount > 0"
            class="absolute -top-1 -right-1 w-5 h-5 bg-accent text-accent-foreground text-xs rounded-full flex items-center justify-center">
            {{ cartCount }}
          </span>
        </a>

        <!-- Mobile Menu Button -->
        <button class="md:hidden p-2 hover:bg-secondary rounded-full transition-colors" (click)="toggleMenu()">
          <lucide-icon [name]="isMenuOpen ? X : Menu" class="w-5 h-5 text-foreground"></lucide-icon>
        </button>
      </div>
    </div>

    <!-- Mobile Navigation -->
    <div *ngIf="isMenuOpen" class="md:hidden py-4 border-t border-border animate-fade-in">
      <div class="flex flex-col gap-4">
        <ng-container *ngFor="let link of navLinks">
          <a [routerLink]="link.path" class="nav-link py-2" [class.nav-link-active]="isActive(link.path)"
            (click)="isMenuOpen = false">
            {{ link.name }}
          </a>
        </ng-container>
      </div>
    </div>
  </div>
</nav>
