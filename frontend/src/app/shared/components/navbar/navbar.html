<nav class="bg-white border-b border-gray-100 sticky top-0 z-50">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex justify-between h-20">
      <!-- Logo & Main Nav -->
      <div class="flex">
        <div class="flex-shrink-0 flex items-center">
          <a routerLink="/" class="text-2xl font-black tracking-tighter text-gray-900 uppercase">
            Saine<span class="text-gray-400">Clothing</span>
          </a>
        </div>
        <div class="hidden sm:ml-10 sm:flex sm:space-x-8 items-center">
          <a routerLink="/products" routerLinkActive="border-gray-900 border-b-2" class="inline-flex items-center px-1 pt-1 text-sm font-bold text-gray-900 uppercase tracking-widest h-full">Collection</a>
          <a routerLink="/suits" routerLinkActive="border-gray-900 border-b-2" class="inline-flex items-center px-1 pt-1 text-sm font-bold text-gray-500 uppercase tracking-widest h-full hover:text-gray-900 transition-colors">Suit Rentals</a>
        </div>
      </div>

      <!-- User Actions -->
      <div class="flex items-center space-x-6">
        <!-- Search (Simple placeholder) -->
        <button class="text-gray-500 hover:text-gray-900">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
        </button>

        <!-- Cart -->
        <a routerLink="/cart" class="group -m-2 p-2 flex items-center relative">
          <svg class="flex-shrink-0 h-6 w-6 text-gray-400 group-hover:text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path>
          </svg>
          <span *ngIf="cartItemCount > 0" class="absolute top-0 right-0 inline-flex items-center justify-center px-2 py-1 text-xs font-bold leading-none text-white transform translate-x-1/2 -translate-y-1/2 bg-gray-900 rounded-full border-2 border-white">
            {{ cartItemCount }}
          </span>
        </a>

        <!-- Profile/Auth -->
        <div class="flex items-center gap-4">
           <ng-container *ngIf="authService.currentUser$ | async as user; else guestTemplate">
              <!-- Simple clickable text for now to replace BS dropdown -->
              <div class="relative group">
                 <button class="text-sm font-bold text-gray-900 uppercase tracking-widest flex items-center gap-1 group">
                   {{ user.name }}
                   <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                 </button>
                 <!-- Dropdown -->
                 <div class="absolute right-0 mt-2 w-48 bg-white border border-gray-100 shadow-xl opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all py-2">
                    <a routerLink="/my-orders" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-50 uppercase tracking-wider font-medium">My Orders</a>
                    <hr class="my-1 border-gray-100">
                    <button (click)="logout()" class="w-full text-left px-4 py-2 text-sm text-red-600 hover:bg-gray-50 uppercase tracking-wider font-bold">Logout</button>
                 </div>
              </div>
           </ng-container>

           <ng-template #guestTemplate>
             <a routerLink="/login" class="text-sm font-bold text-gray-900 uppercase tracking-widest hover:text-gray-500 transition-colors">Sign In</a>
             <a routerLink="/register" class="bg-gray-900 text-white px-5 py-2.5 text-sm font-bold uppercase tracking-widest hover:bg-gray-800 transition-all">Join</a>
           </ng-template>
        </div>
      </div>
    </div>
  </div>
</nav>
