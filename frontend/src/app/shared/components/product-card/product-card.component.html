<a [routerLink]="['/product', id]" class="product-card block group">
    <div class="product-image">
        <img [src]="imageUrl" [alt]="name" loading="lazy" />
    </div>
    <div class="mt-3 space-y-1">
        <h3 class="text-sm text-muted-foreground group-hover:text-foreground transition-colors">
            {{ name }}
        </h3>
        <p class="text-sm font-medium text-foreground">D{{ price }}</p>
    </div>
</a>
