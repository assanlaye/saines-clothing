<section class="py-16">
    <div class="container mx-auto px-4 sm:px-6 lg:px-8">
        <div class="text-center max-w-xl mx-auto">
            <h2 class="text-2xl font-medium text-foreground mb-2">
                Subscribe now & get 20% off
            </h2>
            <p class="text-muted-foreground text-sm mb-6">
                Lorem Ipsum is simply dummy text of the printing and typesetting industry.
            </p>
            <form (ngSubmit)="handleSubmit()" #newsletterForm="ngForm" class="flex gap-0">
                <input type="email" name="email" [(ngModel)]="email" placeholder="Enter your email"
                    class="flex-1 px-4 py-3 bg-background border border-border text-foreground placeholder:text-muted-foreground focus:outline-none focus:border-foreground transition-colors"
                    required />
                <button type="submit"
                    class="px-8 py-3 bg-primary text-primary-foreground text-sm font-medium uppercase tracking-wider hover:bg-primary/90 transition-colors"
                    [disabled]="!newsletterForm.form.valid">
                    Subscribe
                </button>
            </form>
        </div>
    </div>
</section>
