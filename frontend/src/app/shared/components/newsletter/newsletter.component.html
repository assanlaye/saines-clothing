<section class="py-16">
    <div class="container mx-auto px-4 sm:px-6 lg:px-8">
        <div class="text-center max-w-xl mx-auto">
            <h2 class="text-2xl font-medium text-foreground mb-2">
                Subscribe now & get 20% off
            </h2>
            <p class="text-muted-foreground text-sm mb-6">
                Be the first to know about new drops, exclusive offers, and style inspiration.
            </p>
            <form (ngSubmit)="handleSubmit()" #newsletterForm="ngForm" class="flex flex-col sm:flex-row items-stretch gap-2">
                <input type="email" name="email" [(ngModel)]="email" placeholder="Enter your email"
                    class="flex-1 min-w-0 w-full px-4 py-3 sm:h-12 bg-background border border-border text-foreground placeholder:text-muted-foreground focus:outline-none focus:border-foreground transition-colors"
                    required />
                <button type="submit"
                    class="w-full sm:w-auto h-full sm:h-12 px-6 py-3 bg-primary text-primary-foreground text-sm font-medium uppercase tracking-wider hover:bg-primary/90 transition-colors mt-2 sm:mt-0 leading-none"
                    [disabled]="!newsletterForm.form.valid">
                    Subscribe
                </button>
            </form>
        </div>
    </div>
</section>
